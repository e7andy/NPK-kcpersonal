# Apache directives for the HTTPS virtual host of kcpersonal.npk.nu.
#
# Add inside <VirtualHost *:443> for the sub-server, e.g. in Virtualmin under
# Web Configuration > Configure SSL Website > Edit Directives.
# Requires: a2enmod proxy proxy_http headers
#
# The HTTP (port 80) virtual host should only redirect to HTTPS.

# Keep the public host name so Next.js server actions accept the request.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# Let's Encrypt renewals are served by Apache from the document root.
ProxyPass /.well-known/acme-challenge/ !

# The app listens on a unix socket (see deploy/kcpersonal.service).
ProxyPass / unix:/run/kcpersonal/kcpersonal.sock|http://localhost/
ProxyPassReverse / http://localhost/
